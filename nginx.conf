server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière le proxy de Dokploy : redirections relatives (/cv → /cv/) pour garder le https
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Pas de add_header dans les blocs location : nginx n'hériterait plus de ceux-ci.
    # Le cache passe donc par expires.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Fichiers générés par Astro : leur nom contient un hash, ils ne changent jamais
    # ^~ : prioritaire sur la règle des extensions ci-dessous
    location ^~ /_astro/ {
        expires max;
    }

    location ~* \.(?:png|svg|ico|webp|txt|xml)$ {
        expires 1d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
